<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>JOO — Video Editor &amp; AI Video Creator</title>
  <meta name="description" content="Portfolio of JOO — Professional Video Editor and AI Video Creator crafting cinematic visuals and high-retention edits." />

  <!-- Glowing Cyan "J" Favicon for Browser Tab -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%2302040a'/><text x='50%25' y='72%25' font-size='65' font-family='sans-serif' font-weight='900' fill='%2338bdf8' text-anchor='middle'>J</text></svg>" />

  <!-- Open Graph Meta Tags (WhatsApp & Social Preview) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://youssefjoeyhmh-ops.github.io/joo-edits/" />
  <meta property="og:title" content="JOO — Video Editor &amp; AI Creator" />
  <meta property="og:description" content="Cinematic Visuals, DaVinci Resolve Color Grading &amp; High-Retention Edits." />
  <meta property="og:image" content="https://youssefjoeyhmh-ops.github.io/joo-edits/profile.jpg" />

  <!-- Google Fonts: English & Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-black: #000206;
      --bg-navy: #04091a;
      --bg-card: rgba(6, 15, 38, 0.75);
      --bg-card-hover: rgba(10, 24, 60, 0.95);
      
      --cyan-neon: #38bdf8;
      --cyan-bright: #00f0ff;
      --blue-electric: #2563eb;
      --border-blue: rgba(56, 189, 248, 0.18);
      --border-glow: rgba(56, 189, 248, 0.6);

      --text-white: #ffffff;
      --text-gray: #94a3b8;
      --text-dim: #64748b;

      --font-heading: 'Syne', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --radius-full: 9999px;
      
      --ease-cinema: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html[dir="rtl"] {
      --font-heading: 'Cairo', sans-serif;
      --font-body: 'Cairo', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html { scroll-behavior: smooth; color-scheme: dark; }

    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.2) 0%, transparent 60%),
        radial-gradient(circle at 100% 35%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 0% 75%, rgba(29, 78, 216, 0.12) 0%, transparent 55%);
      background-attachment: fixed;
    }

    ::selection { background: var(--cyan-neon); color: #000206; }

    .ambient-sphere {
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      max-width: 900px;
      height: 600px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(0, 2, 6, 0) 70%);
      pointer-events: none;
      z-index: 0;
      filter: blur(90px);
      animation: ambientPulse 8s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0% { transform: translateX(-50%) scale(0.92); opacity: 0.5; }
      100% { transform: translateX(-50%) scale(1.15); opacity: 0.9; }
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-heading);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    a { text-decoration: none; color: inherit; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 50px;
      padding: 12px 28px;
      border-radius: var(--radius-full);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.35s var(--ease-cinema);
      border: 1px solid transparent;
      outline: none;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: linear-gradient(135deg, #38bdf8 0%, #1d4ed8 100%);
      color: #ffffff;
      box-shadow: 0 10px 30px -5px rgba(56, 189, 248, 0.5);
    }
    .btn-primary:active { transform: scale(0.96); }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-white);
      border: 1px solid var(--border-blue);
      backdrop-filter: blur(12px);
    }
    .btn-secondary:active { transform: scale(0.96); background: rgba(56, 189, 248, 0.1); }

    /* Navbar */
    .site-nav {
      position: fixed;
      top: 14px;
      left: 0;
      right: 0;
      z-index: 100;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 22px;
      border-radius: var(--radius-full);
      background: rgba(4, 9, 26, 0.88);
      border: 1px solid var(--border-blue);
      backdrop-filter: blur(20px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85);
    }

    .brand-logo {
      font-family: var(--font-heading);
      font-size: 1.45rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-glow { color: var(--cyan-neon); text-shadow: 0 0 15px rgba(56, 189, 248, 0.7); }

    .nav-desktop-links {
      display: flex;
      align-items: center;
      gap: 26px;
      list-style: none;
    }

    .nav-link {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-gray);
      transition: color 0.3s ease;
    }
    .nav-link:hover { color: var(--cyan-neon); }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 15px;
      border-radius: var(--radius-full);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--border-blue);
      color: var(--cyan-neon);
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .lang-toggle-btn:hover {
      background: rgba(56, 189, 248, 0.22);
      transform: scale(1.05);
    }

    /* Urgency Badge */
    .urgency-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: var(--radius-full);
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.35);
      margin-bottom: 18px;
      animation: floatUrgent 3.5s ease-in-out infinite alternate;
    }

    @keyframes floatUrgent {
      0% { transform: translateY(0); }
      100% { transform: translateY(-3px); }
    }

    .pulse-dot-green {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
      animation: blinkDot 1.5s infinite;
    }

    @keyframes blinkDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .urgency-text {
      color: #86efac;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    /* Hero */
    .hero {
      padding: 145px 0 65px 0;
      text-align: center;
      position: relative;
    }

    .hero-title {
      font-size: clamp(4.2rem, 18vw, 7.5rem);
      margin-bottom: 8px;
      line-height: 0.95;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #38bdf8 50%, #1d4ed8 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShine 4s linear infinite;
      filter: drop-shadow(0 0 40px rgba(56, 189, 248, 0.4));
    }

    @keyframes textShine { to { background-position: 200% center; } }

    .hero-subtitle {
      font-size: clamp(1.05rem, 4vw, 1.35rem);
      color: var(--text-gray);
      margin-bottom: 32px;
      padding: 0 10px;
    }
    .hero-subtitle span { color: var(--cyan-neon); font-weight: 600; font-style: italic; }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 50px;
    }

    /* Showreel Card */
    .showreel-card {
      position: relative;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-glow);
      background: #000;
      overflow: hidden;
      box-shadow: 0 25px 70px -15px rgba(0, 0, 0, 0.95), 0 0 45px rgba(56, 189, 248, 0.25);
    }

    .showreel-frame {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000206;
      overflow: hidden;
    }

    .bg-video-loop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.88;
      pointer-events: none; /* Prevents scroll clicks from triggering video */
      transition: transform 0.6s var(--ease-cinema);
    }
    .showreel-card:hover .bg-video-loop { transform: scale(1.04); opacity: 0.98; }

    .showreel-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(4, 9, 26, 0.15) 0%, rgba(0, 2, 6, 0.8) 100%);
      z-index: 2;
      pointer-events: none; /* Crucial: allows scroll without accidental play clicks */
    }

    .play-btn-circle {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      border: 3px solid rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.65);
      animation: pulsePlay 2s infinite;
      transition: transform 0.3s ease;
      cursor: pointer;
      pointer-events: auto; /* Play button explicitly clickable */
    }

    @keyframes pulsePlay {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(56, 189, 248, 0.5); }
      50% { transform: scale(1.08); box-shadow: 0 0 50px rgba(56, 189, 248, 0.85); }
    }

    .play-btn-circle svg { transform: translateX(3px); width: 34px; height: 34px; }

    .showreel-text {
      margin-top: 16px;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      cursor: pointer;
      pointer-events: auto;
    }

    /* Horizontal Carousel */
    .portfolio-section { padding: 90px 0 50px 0; }

    .section-header-flex {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 30px;
    }
    .section-header-flex h2 { font-size: clamp(2rem, 5vw, 2.8rem); }

    .swipe-hint {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid var(--border-blue);
      color: var(--cyan-neon);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .projects-carousel {
      display: flex;
      gap: 22px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding: 10px 4px 30px 4px;
      scrollbar-width: none;
      direction: ltr;
    }
    .projects-carousel::-webkit-scrollbar { display: none; }

    .project-card {
      flex: 0 0 85%;
      max-width: 460px;
      scroll-snap-align: start;
      background: var(--bg-card);
      border: 1px solid var(--border-blue);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.4s var(--ease-cinema);
      position: relative;
    }
    .project-card:hover {
      border-color: var(--cyan-neon);
      box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.9), 0 0 35px rgba(56, 189, 248, 0.3);
      transform: translateY(-6px);
    }

    .project-thumbnail {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #02050e;
      cursor: pointer;
      overflow: hidden;
    }

    .project-thumbnail video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.88;
      pointer-events: none;
      transition: transform 0.6s var(--ease-cinema);
    }
    .project-card:hover .project-thumbnail video { transform: scale(1.08); opacity: 1; }

    .project-tag {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 5px 14px;
      border-radius: var(--radius-full);
      background: rgba(0, 2, 6, 0.85);
      border: 1px solid var(--border-blue);
      backdrop-filter: blur(8px);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--cyan-neon);
      letter-spacing: 0.05em;
      z-index: 3;
    }

    .project-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8 0%, #1d4ed8 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
      transition: transform 0.3s ease;
    }
    .project-card:hover .project-play {
      transform: translate(-50%, -50%) scale(1.1);
      background: #fff;
      color: #000206;
    }

    .project-body { padding: 24px; display: flex; flex-direction: column; flex-grow: 1; }
    html[dir="rtl"] .project-body { text-align: right; }
    .project-title { font-size: 1.25rem; margin-bottom: 6px; color: #fff; }
    .project-desc { font-size: 0.88rem; color: var(--text-gray); margin-bottom: 18px; flex-grow: 1; line-height: 1.5; }

    .watch-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--cyan-neon);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .watch-btn:hover { transform: translateX(4px); }

    /* =========================================================
       COLOR GRADING BEFORE/AFTER (ENLARGED & DETAIL-FOCUSED)
       ========================================================= */
    .color-suite-section { padding: 50px 0 90px 0; }

    .grading-wrapper {
      position: relative;
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-glow);
      overflow: hidden;
      box-shadow: 0 25px 65px -15px rgba(0, 0, 0, 0.95), 0 0 35px rgba(56, 189, 248, 0.2);
    }

    /* Enlarged Aspect Ratio: 4:3 for clear face details */
    .compare-container {
      position: relative;
      width: 100%;
      padding-top: 75%; /* Taller ratio so facial features & color depth are large */
      min-height: 380px;
      overflow: hidden;
      user-select: none;
    }

    .compare-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      pointer-events: none;
    }

    .compare-before-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      clip-path: polygon(0 0, var(--slider-pos, 50%) 0, var(--slider-pos, 50%) 100%, 0 100%);
      pointer-events: none;
    }

    .compare-before-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      filter: saturate(0.2) contrast(0.78) brightness(1.18);
    }

    .compare-divider {
      position: absolute;
      top: 0;
      bottom: 0;
      left: var(--slider-pos, 50%);
      width: 3px;
      background: var(--cyan-bright);
      box-shadow: 0 0 15px var(--cyan-bright);
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 10;
    }

    .compare-handle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8 0%, #1d4ed8 100%);
      border: 3px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.85);
      font-size: 0.9rem;
      font-weight: 800;
    }

    .compare-badge {
      position: absolute;
      top: 16px;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      background: rgba(0, 2, 6, 0.85);
      border: 1px solid var(--border-blue);
      backdrop-filter: blur(8px);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      z-index: 11;
      pointer-events: none;
    }
    .badge-before { left: 16px; color: var(--text-gray); }
    .badge-after { right: 16px; color: var(--cyan-neon); }

    .compare-range {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: ew-resize;
      z-index: 20;
    }

    /* Pricing Section */
    .pricing-section { padding: 90px 0; }

    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 24px;
      margin-top: 40px;
    }

    .pricing-card {
      background: var(--bg-card);
      border: 1px solid var(--border-blue);
      border-radius: var(--radius-lg);
      padding: 36px 26px;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.35s var(--ease-cinema);
    }
    .pricing-card:hover {
      transform: translateY(-8px);
      border-color: var(--cyan-neon);
      box-shadow: 0 20px 45px -15px rgba(0,0,0,0.9), 0 0 30px rgba(56, 189, 248, 0.25);
    }

    .pricing-card.popular {
      border-color: var(--cyan-neon);
      background: rgba(10, 24, 60, 0.85);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.2);
    }

    .popular-tag {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #38bdf8 0%, #1d4ed8 100%);
      color: #fff;
      padding: 4px 14px;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .package-name { font-size: 1.3rem; margin-bottom: 6px; color: #fff; }
    .package-price {
      font-size: 2.6rem;
      font-family: var(--font-heading);
      font-weight: 800;
      color: var(--cyan-neon);
      line-height: 1;
      margin: 14px 0 6px 0;
    }
    .package-price span { font-size: 0.92rem; color: var(--text-gray); font-family: var(--font-body); font-weight: 500; }
    .package-sub { font-size: 0.84rem; color: var(--text-gray); margin-bottom: 24px; }

    .features-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 30px;
      flex-grow: 1;
    }
